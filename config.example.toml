# bangumi2memos 配置模板
# 复制为当前目录下的 config.toml 即可——程序默认读取当前路径下的 config.toml
# （不存在则跳过），所有项也可用命令行参数覆盖（命令行优先）。
# 各键所示值即程序默认值；未注释的必填项请按需填写。

# ---------- Bangumi ----------
bangumi_username = ""                 # Bangumi 用户名或 UID（必填，无默认值）
# bangumi_base = "https://api.bgm.tv"
# bangumi_ip = ""                     # 直连 IP，绕过 DNS（域名与 TLS 校验不变；仅网络 DNS
#                                     # 异常时使用，Termux 等环境一般无需设置，IP 可用 ping 获取）
# user_agent = "bangumi2memos (https://github.com/inchei/bangumi2memos)"
# link_base = "https://bgm.tv"        # memo 正文的条目链接域名，如 "https://fxbgm.tv"

# ---------- Memos 写入 ----------
# 方式一：API 模式（memos 运行中）
# api = ""                            # memos 地址，如 "http://localhost:5230"
# password = ""                       # memos >= 0.30 用密码登录
# token = ""                          # 或直接填 Access Token（memos < 0.30）

# 方式二：直写数据库
# db = "memos.db"
# user = "admin"

# ---------- 可选 ----------
# visibility = "private"              # private / protected / public
# tag = ""                            # 附加标签，空 = 不加；默认以 #tag 追加到正文并显式传入
# tag_in_content = true               # 是否将标签追加到正文（默认 true，同时显式传入）；设为 false 则仅显式传入标签（API: tags，直写库: payload.tags），正文不含 #tag，编辑 memo 后标签会丢失
# subject_types = []                  # 空 = 全部；例如 [2, 4] 只导入动画与游戏

# ---------- 同步 ----------
# dry_run = false                     # 只预览，不写入
# full = false                        # 忽略状态文件，全量扫描
# delete = false                      # 卸载已导入的 Bangumi memos（删除 uid 以 bgm- 开头
#                                     # 的 memo 并重置增量状态；需同 --api 或 --db）
# verbose = false                     # 逐条输出创建的 memo（默认只输出汇总）
# state = "state.json"                # 增量状态文件
# timeout = 30                        # HTTP 超时秒数
# limit = 100                         # Bangumi 分页大小（上限 100）
